name: Bug report
description: Report a reproducible problem using synthetic, non-sensitive data.
title: '[Bug] '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 'Do not upload production HAR files, credentials, personal data, or private URLs. For a security issue, read SECURITY.md instead.'
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Steps and an invented fixture, never a real capture.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Version and environment
      placeholder: 'TraceTidy 1.0.0, Node 22 / Chrome, operating system'
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This report contains no production captures, credentials, personal data, or confidential URLs.
          required: true
